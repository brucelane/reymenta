<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strudel (jam)</title>
<!--
  The online Jam's Strudel layer (2026-11-26): the room's Strudel players' code runs HERE, in an
  <iframe sandbox="allow-scripts"> (no allow-same-origin): an opaque origin that can't read the Reymenta page, its
  storage or its connection. Every page plays the same code on the room's shared beat.
  Messages from the parent page only (event.source === parent):
    {type:'play', code, cps, startIn}   evaluate `code` (the players' parts, each with $: lines) in `startIn` ms (the
                                        next bar line of the shared clock), at `cps` cycles a second (one cycle = a bar)
    {type:'stop'}                       silence
  To the parent: {type:'ready'}, {type:'needtap'} (audio waits for a tap in this frame), {type:'tapped'} (send the
  code again), {type:'playing'}, {type:'error', message}.
  @strudel/web 1.3.0 (AGPL) from jsDelivr, pinned with its hash (the same bytes as the app's node_modules copy);
  sounds as in the Workshop: dirt samples, the drum machines, from GitHub.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; font: 14px system-ui, sans-serif; color: #eee; }
  button { all: unset; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; gap: 6px; cursor: pointer; background: #15151b; border: 1px solid #3a3a46; border-radius: 10px; }
  button[hidden] { display: none; }
  #state { display: flex; align-items: center; justify-content: center; height: 100%; color: #b4abc4; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@strudel/web@1.3.0/dist/index.js"
  integrity="sha384-Be7toEZy01lox8utUZEOBM2nCd1jVX8R9A3YwfZ7j5kBTv/MKy+LlCbTWqE97W8x" crossorigin="anonymous"></script>
</head>
<body>
<button id="tap" hidden>🔊 Strudel</button>
<div id="state">🔊 Strudel</div>
<script>
  'use strict';
  const post = (m) => parent.postMessage(m, '*');
  const tap = document.getElementById('tap');
  const state = document.getElementById('state');
  const GH = 'https://raw.githubusercontent.com/';
  const S = window.strudel;
  let ready, pending, timer;

  function init() {
    ready ??= S.initStrudel({
      onEvalError: (err) => post({ type: 'error', message: String(err && err.message || err).slice(0, 300) }),
      prebake: () => Promise.allSettled([
        S.samples(GH + 'tidalcycles/dirt-samples/main/strudel.json'),
        S.samples(GH + 'felixroos/dough-samples/main/tidal-drum-machines.json'),
        S.aliasBank(GH + 'todepond/samples/main/tidal-drum-machines-alias.json'),
      ]),
    });
    return ready;
  }

  function audioOk() {
    try { return S.getAudioContext().state === 'running'; } catch { return false; }
  }
  // superdough's AudioWorklets (distort, crush, shape... the effects strudel-flow's Texture node writes) load in
  // initAudio(), which @strudel/web only runs on the first click in this frame: with autoplay allowed there's no
  // click, and those effects failed ("AudioWorklet does not have a valid AudioWorkletGlobalScope", 2026-11-26)
  let audioInit;
  function initAudio() {
    audioInit ??= Promise.resolve(S.initAudio()).catch((e) => {
      audioInit = undefined;
      post({ type: 'error', message: 'audio: ' + String(e && e.message || e).slice(0, 200) });
    });
    return audioInit;
  }
  function showTap(on) { tap.hidden = !on; state.hidden = on; if (on) post({ type: 'needtap' }); }

  async function play(m) {
    await init();
    clearTimeout(timer);
    if (!audioOk()) { try { await S.getAudioContext().resume(); } catch {} }
    if (!audioOk()) { pending = m; showTap(true); return; }
    await initAudio();
    // the room's tempo wins over any setcps/setcpm in the code: it's appended last
    const code = `${m.code}\nsetcps(${Number(m.cps)})`;
    timer = setTimeout(async () => {
      try {
        await S.evaluate(code);
        post({ type: 'playing' });
      } catch (e) {
        post({ type: 'error', message: String(e && e.message || e).slice(0, 300) });
      }
    }, Math.max(0, Math.min(10000, Number(m.startIn) || 0)));
  }

  tap.addEventListener('click', async () => {
    await init();
    try { await S.getAudioContext().resume(); } catch {}
    if (!audioOk()) return;
    await initAudio();
    showTap(false);
    // the parent sends the code again, with a fresh time to the next bar line
    if (pending) { pending = undefined; post({ type: 'tapped' }); }
  });

  addEventListener('message', (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'play' && typeof m.code === 'string' && m.code.length <= 20000 && Number(m.cps) > 0) void play(m);
    else if (m.type === 'stop') { clearTimeout(timer); pending = undefined; try { S.hush(); } catch {} }
  });
  void init();
  post({ type: 'ready' });
</script>
</body>
</html>
